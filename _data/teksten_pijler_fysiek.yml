# Pijler-pagina: Fysiek, voeding & bewegen — aanpassen via /admin/
kop: "Fysiek, voeding & bewegen"
subtitel: "Jouw lichaam is het fundament van je welzijn"
intro: "Klachten in je lichaam zijn zelden alleen lichamelijk. Een gespannen schouder, chronische vermoeidheid, spijsverteringsproblemen of slaapgebrek — ze vertellen vaak een dieper verhaal. De bewust-makers binnen deze pijler werken vanuit een holistische benadering: ze kijken naar het lichaam als geheel, in samenhang met je geest en energie."
wat_titel: "Wat valt onder deze pijler?"
items:
  - "Massage & lichaamswerk — zoals shiatsu, cranio-sacraaltherapie, sportmassage en lymfedrainage"
  - "Voeding & leefstijl — orthomoleculaire therapie, voedingsadvies en detox-begeleiding"
  - "Beweging & ademhaling — yoga, ademcoaching, qigong en functionele training"
  - "Pijnbegeleiding — bij chronische klachten, blessures of herstel na ziekte"
voor_wie_titel: "Voor wie?"
voor_wie_tekst: "Voor iedereen die iets in zijn of haar lichaam wil aanpakken dat niet helemaal goed voelt — van fysieke klachten tot het gevoel dat je lichaam meer energie verdient. Of je nu op zoek bent naar ontspanning, herstel of een gezondere leefstijl: er is altijd een bewust-maker die bij jouw situatie past."
cta_titel: "Weet je niet waar je moet beginnen?"
cta_tekst: "Marcella en Elsemarie helpen je kosteloos op weg. In een gratis adviesgesprek bespreken we jouw situatie en welke bewust-maker het beste bij jou past."
cta_knop: "Vraag een gratis adviesgesprek aan"
makers_knop: "Vind een bewust-maker Fysiek"
