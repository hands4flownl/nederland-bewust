kop: Fysiek, voeding & bewegen
subtitel: Jouw lichaam is het fundament van je welzijn
intro: >-
  Vanuit een holistisch perspectief wordt het menselijk lichaam niet gezien als
  een losstaand geheel van organen en systemen, maar als een diepe samenhang
  tussen lichaam, geest, emoties en ziel. Alles staat met elkaar in verbinding.
  Fysieke klachten kunnen een weerspiegeling zijn van emotionele spanningen,
  mentale overtuigingen of een energetische disbalans.


  Holistisch erkennen we dat ware gezondheid verder gaat dan de afwezigheid van ziekte. Het draait om balans op alle niveaus, fysiek, mentaal, emotioneel en spiritueel. Ieder mens is uniek, met een eigen geschiedenis, gevoelswereld en levenspad. Daarom vraagt gezondheid om aandacht voor het geheel, in plaats van alleen voor het symptoom.


  Door bewustwording, voeding, beweging, energetisch werk, meditatie en andere natuurlijke therapieën wordt het zelf herstellend vermogen van het lichaam gestimuleerd. Het doel is niet alleen genezing, maar ook groei, balans en verbondenheid, met jezelf en de wereld om je heen.
wat_titel: Wat valt onder deze pijler?
items:
  - Binnen deze pijler staat het leren begrijpen van je lichamelijke klachten
    centraal. Onze Bewust-makers helpen je om je lichaam als geheel beter te
    leren kennen en te begrijpen. De (pijn)signalen van je lichaam kun je leren
    zien als boodschappers. Ze kunnen je bewust maken van wat jouw onderbewuste
    onder de aandacht wil brengen. Zo kunnen oude
  - onverwerkte emoties gezien worden en kan de energie weer vrij gaan stromen
    door jouw mooie
  - sterke lichaam. Door anders naar je lichaam en je klachten te leren kijken
  - ontstaat ruimte voor nieuwe inzichten en bewustwording. Zo ontdek je steeds
    meer de verbinding tussen lichaam
  - geest
  - emoties en ziel en kun jij weer meer in je OER-kracht staan.
voor_wie_titel: Voor wie?
voor_wie_tekst: >-
  Ervaar jij lichamelijke ongemakken of fysieke pijn die jou in je dagelijkse
  leven belemmeren? Of wil je beter leren begrijpen wat jouw lichaam jou
  vertelt?


  Dan nodigen we je graag uit om in contact te komen met één van onze Bewust-makers.


  Ontdek de verschillende holistische methodes en laat je inspireren door de kennis en informatie die ons platform en onze Bewust-makers over het menselijk lichaam met je delen. Zo kun je zelf aan de slag met het beter leren kennen en begrijpen van jouw lichaam.
cta_titel: Weet je niet waar je moet beginnen?
cta_tekst: Marcella en Elsemarie helpen je kosteloos op weg. In een gratis
  adviesgesprek bespreken we jouw situatie en welke bewust-maker het beste bij
  jou past.
cta_knop: Vraag een gratis adviesgesprek aan
