# Pijler-pagina: Mentaal & coaching — aanpassen via /admin/
kop: "Mentaal & coaching"
subtitel: "Jouw gedachten vormen jouw werkelijkheid"
intro: "Je mentale gezondheid bepaalt hoe je je voelt — in je hoofd, je lichaam en in je relaties. Stress, angst, vastgelopen patronen of het gevoel dat je niet jezelf bent: het zijn signalen die vragen om aandacht. De bewust-makers binnen deze pijler bieden een veilige ruimte om te onderzoeken wat er speelt en hoe je verder kunt."
wat_titel: "Wat valt onder deze pijler?"
items:
  - "Life coaching & persoonlijke ontwikkeling — voor meer richting, zelfvertrouwen en levensgeluk"
  - "Psychologische therapie — zoals ACT, cognitieve gedragstherapie en traumaverwerking"
  - "NLP & hypnotherapie — voor het doorbreken van beperkende overtuigingen"
  - "Relatie- en communicatiecoaching — voor groei in je persoonlijke en professionele relaties"
  - "Rouw en verlies begeleiding — ondersteuning bij verlies van een dierbare of ingrijpende verandering"
voor_wie_titel: "Voor wie?"
voor_wie_tekst: "Voor mensen die vastlopen, meer uit het leven willen halen, patronen willen doorbreken of gewoon een goed gesprek nodig hebben. Je hoeft geen crisis te hebben om hulp te zoeken — ook preventief werken aan je mentale gezondheid is een daad van zelfzorg."
cta_titel: "Weet je niet waar je moet beginnen?"
cta_tekst: "Marcella en Elsemarie helpen je kosteloos op weg. In een gratis adviesgesprek bespreken we jouw situatie en welke bewust-maker het beste bij jou past."
cta_knop: "Vraag een gratis adviesgesprek aan"
makers_knop: "Vind een bewust-maker Mentaal"
