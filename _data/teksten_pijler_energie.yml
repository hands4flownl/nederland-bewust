# Pijler-pagina: Energie & spirit — aanpassen via /admin/
kop: "Energie & spirit"
subtitel: "Alles is frequentie — jouw energie bepaalt hoe je je voelt"
intro: "Alles is energie. Een hoge energiefrequentie betekent dat je je blij, vitaal en verbonden voelt. Wanneer die energie stagneert — door stress, trauma of levenservaringen — kan dit merkbaar zijn in je lichaam, je gedachten en je relaties. De bewust-makers binnen deze pijler helpen je om jouw energetische systeem te reinigen, te balanceren en te versterken."
wat_titel: "Wat valt onder deze pijler?"
items:
  - "Energetische healing — zoals Reiki, Theta Healing en Quantum Healing"
  - "Meditatie & mindfulness — voor innerlijke rust en aanwezigheid"
  - "Human Design & astrologie — inzicht in wie jij van nature bent"
  - "Spirituele coaching — begeleiding bij zingeving, zielsmissie en innerlijke groei"
  - "Shamaans werk & rituelen — verbinding met natuur, voorouders en diepere lagen van het bestaan"
voor_wie_titel: "Voor wie?"
voor_wie_tekst: "Voor mensen die voelen dat er meer is dan het zichtbare — die op zoek zijn naar diepgang, verbinding en authenticiteit. Of je nu nieuw bent in de wereld van energie en spirit, of al jaren op pad bent: er is een bewust-maker die aansluit bij jouw reis."
cta_titel: "Weet je niet waar je moet beginnen?"
cta_tekst: "Marcella en Elsemarie helpen je kosteloos op weg. In een gratis adviesgesprek bespreken we jouw situatie en welke bewust-maker het beste bij jou past."
cta_knop: "Vraag een gratis adviesgesprek aan"
makers_knop: "Vind een bewust-maker Energie"
